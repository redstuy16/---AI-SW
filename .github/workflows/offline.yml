name: 오프라인 회귀와 공개 자료 검사
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,security]"
      - run: python -m pytest -q
      - run: python qa/prepublish_check.py --output build/prepublish/security_summary.json
      - run: python -m pip_audit --skip-editable --cache-dir build/audit-cache
