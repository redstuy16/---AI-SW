<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-TRSA · 연구 작업대</title><link rel="stylesheet" href="/assets/workbench.css"><script src="/assets/bootstrap.js" defer></script><script src="/assets/cycle5_ui.js" defer></script><script src="/assets/workbench.js" defer></script><script src="/assets/provider_settings.js" defer></script><script src="/assets/product_ux.js" defer></script><script src="/assets/live_api_test.js" defer></script><script src="/assets/tutorial_content.js" defer></script><script src="/assets/beginner_ux.js" defer></script><script src="/assets/tutorial.js" defer></script><script src="/assets/research_design.js" defer></script><link rel="stylesheet" href="/assets/research_workspace.css"><script src="/assets/research_workspace.js" defer></script></head>
<body data-auth-state="connecting"><a class="skip" href="#content">본문으로 이동</a>
<section id="auth-status" class="auth-panel" role="status" aria-live="polite"><h1>H-TRSA에 연결하고 있습니다.</h1></section>
<div class="shell" hidden><aside class="sidebar"><a class="brand" href="#research">H-TRSA<span>연구 작업대</span></a><nav aria-label="전역 메뉴"><button data-view="research">연구</button><button data-view="library">자료 보관함</button><button data-view="usage">사용량</button><button data-view="settings">설정</button></nav></aside>

<div id="notice" role="status" aria-live="polite" hidden></div><main id="content" tabindex="-1"><h1>연구</h1><p>저장된 연구를 불러오는 중입니다.</p></main>
